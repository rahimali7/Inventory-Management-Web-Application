name: CI

on:
  pull_request:
  push:
    branches: [main]

# Newer pushes to the same branch supersede in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # next@16 requires >=20.9.0; 22 is the current LTS.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next.js shares a build cache in .next/cache between builds.
      # See node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      # Next 16 removed `next lint`, and `next build` no longer runs linting,
      # so this has to be its own step or lint errors ship silently.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build
